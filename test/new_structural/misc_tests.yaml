- name: "backspace after (a (b c)): first press blocked, second deletes form"
  code: "(a (b c))"
  cursor: end
  steps:
    - action: backspace
      expect_code: "(a (b c))"
    - action: backspace
      expect_code: ""
    - action: undo
      expect_code: "(a (b c))"
    - action: backspace
      expect_code: "(a (b c))"
    - action: backspace
      expect_code: ""
  new_code: ""

