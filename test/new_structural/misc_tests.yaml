- name: "type expression, enter drops focus, auto-close on new line"
  code: ""
  steps:
    - action: [type, "(a1 bar)"]
      expect_code: "(a1 bar)"
      new_selection: "(a1 bar)"
    - action: enter
      expect_code: "(a1 bar)\n"
      new_selection: null
    - action: [type, "("]
      expect_code: "(a1 bar)\n()"
      new_selection: "()"
  new_code: "(a1 bar)\n()"
  new_selection: "()"
