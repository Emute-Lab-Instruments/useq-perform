# Structural Editor Misc Test Cases — Keyboard, Typing & Structural Highlights
#
# These YAML files are a living regression/spec-refinement suite for
# data-driven editor command scenarios: command sequences, cursor/focus
# movement, source edits, and bug-capture cases that should be easy for agents
# to extend. A failing row may indicate an implementation bug, a semantic
# refinement, or a spec update that still needs to land; do not assume failures
# are stale expectations without triage.
#
# FORMAT (step-based, for undo/history-dependent sequences):
#   name: descriptive test name
#   code: initial buffer content
#   cursor: initial cursor position ("end" or 0-based offset) — defaults to "end"
#   steps: ordered list of action→assertion pairs
#     action: single action or list of actions  (harness key: singular)
#     expect_code: expected buffer content after action
#     new_selection: expected node focus after action (null = no focus)
#   new_code: expected final buffer content (top-level, checked after all steps)
#   new_selection: expected final selection/focus
#
# KEYBOARD ACTIONS:
#   type "text"  — type text character by character (triggers auto-close, etc.)
#   backspace    — backspace key (structural-aware)
#   key.delete   — forward Delete key (bracket-protection / confirm-flash path)
#                  NB: bare `delete` is the STRUCTURAL edit.delete action; the
#                  literal keypress must be named `key.delete` (see testHarness).
#   undo         — undo last action
#   enter        — enter / newline key

# ── §0. Canonical intent sequence: structural + text commands ──────────────

- name: "canonical intent path: structural navigation then typed insertion"
  code: "(foo bar)"
  selection: "foo"
  steps:
    - action: next
      expect_code: "(foo bar)"
      new_selection: "bar"
    - action: [type, "baz"]
      expect_code: "(foo bazbar)"
      new_selection: "bazbar"
  new_code: "(foo bazbar)"
  new_selection: "bazbar"

# ── §1. Auto-close parentheses: insert, backspace, undo, delete ────────────

- name: "auto-close: ( inserts pair, backspace deletes both"
  code: ""
  steps:
    - action: [type, "("]
      expect_code: "()"
      new_selection: "()"
    - action: backspace
      expect_code: ""
    - action: undo
      expect_code: "()"
      new_selection: "()"
    - action: key.delete
      expect_code: ""
  new_code: ""

- name: "backspace after closing paren: first press blocked, second deletes form"
  code: "(foo)"
  cursor: end
  steps:
    - action: backspace
      expect_code: "(foo)"
    - action: backspace
      expect_code: ""
    - action: undo
      expect_code: "(foo)"
  new_code: "(foo)"

