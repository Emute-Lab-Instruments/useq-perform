# ── §7. Undo restores after safe-delete escalation ────────────────────────

- name: "backspace after opening paren: undo restores after escalation delete"
  code: "(foo)"
  cursor: 1
  steps:
    - action: backspace
      expect_code: "(foo)"
    - action: backspace
      expect_code: ""
    - action: undo
      expect_code: "(foo)"
