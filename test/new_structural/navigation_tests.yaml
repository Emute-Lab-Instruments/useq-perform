# Structural Code Editor Navigation Test Cases for Clojure
#
# These YAML files are a living regression/spec-refinement suite for
# data-driven editor command scenarios: command sequences, cursor/focus
# movement, source edits, and bug-capture cases that should be easy for agents
# to extend. A failing row may indicate an implementation bug, a semantic
# refinement, or a spec update that still needs to land; do not assume failures
# are stale expectations without triage.
#
# FORMAT:
#   code: source text with «» marking the initially selected node
#   actions: navigation action or list of actions
#   expected: text of the node expected to be selected after actions
#
# NAVIGATION AXES (per structural-editing.md §5.1):
#   next/prev             — sibling at same level (stops at boundary)     §5.1.3
#   right/left            — horizontal spatial (Euler-tour traversal)     §5.1.9
#   in/out                — structural level change (enter/exit compound) §5.1.2/§5.1.1
#   up/down               — vertical spatial (line-based)                 §5.1.10
#   first/last            — jump to first/last sibling                   §5.1.4
#   extendNext/extendPrev — grow range cursor outward                    §5.1.5
#   shrink                — release outermost end of range cursor        §5.1.6
#   intoMeta              — descend into Meta payload                    §5.1.7
#   nextHole/prevHole     — jump to next/previous hole                   §5.1.8

# ── §1. Basic symbol navigation (next/prev) ─────────────────────────────────

- name: "next symbol - simple"
  code: "«hello» world"
  actions: next
  expected: "world"

- name: "previous symbol - simple"
  code: "hello «world»"
  actions: previous
  expected: "hello"

- name: "next symbol - multiple symbols"
  code: "foo «bar» baz"
  actions: next
  expected: "baz"

- name: "previous symbol - multiple symbols"
  code: "«foo» bar baz"
  actions: previous
  expected: "foo"

- name: "next stops at level boundary"
  code: "(+ 1 «(* 2 3)»)"
  actions: next
  expected: "(* 2 3)"

- name: "next within list - stays at same level"
  code: "(«+» 1 (* 2 3))"
  actions: [next, next, next]
  expected: "(* 2 3)"

- name: "previous stops at level boundary"
  code: "(«+» 1 (* 2 3))"
  actions: previous
  expected: "+"

# ── §2. Entering and exiting compounds (in/out) ─────────────────────────────

- name: "enter list with in"
  code: "«(hello world)»"
  actions: in
  expected: "hello"

- name: "exit list with out"
  code: "(«hello» world)"
  actions: out
  expected: "(hello world)"

- name: "out at outermost level reaches document root"
  code: "«(foo)»"
  actions: out
  expected: "(foo)"

- name: "in on leaf is no-op"
  code: "(«hello» world)"
  actions: in
  expected: "hello"

- name: "in on empty compound is no-op"
  code: "«()»"
  actions: in
  expected: "()"

- name: "deep in/out round-trip"
  code: "«(a (b (c d)))»"
  actions: [in, next, in, next, in]
  expected: "c"

- name: "out from deep nesting"
  code: "(a (b («c» d)))"
  actions: [out, out, out]
  expected: "(a (b (c d)))"

# ── §3. Horizontal spatial navigation (right/left) ─────────────────────────
#
# right/left traverse the tree in depth-first Euler-tour order.
# Compounds are visited twice: pre-order (before children) and post-order (after).
# When arriving via non-spatial ops, compounds start in pre-order.

- name: "right enters nested expression"
  code: "(+ 1 «(* 2 3)»)"
  actions: right
  expected: "*"

- name: "right through siblings inside list"
  code: "(+ «1» (* 2 3))"
  actions: right
  expected: "(* 2 3)"

- name: "right exits at end of nested expression"
  code: "(+ 1 (* 2 «3»))"
  actions: right
  expected: "(* 2 3)"

- name: "right exits to parent level"
  code: "(+ 1 «(* 2 3)»)"
  actions: [right, right, right, right, right]
  expected: "(+ 1 (* 2 3))"

- name: "right moves spatially through nested structure"
  code: "«+» 1 (* 2 3)) hello"
  actions: [right, right, right, right, right, right, right, right]
  expected: "hello"

- name: "left exits then moves to previous"
  code: "(+ 1 («*» 2 3))"
  actions: left
  expected: "(* 2 3)"

- name: "left moves to previous at same level"
  code: "(+ 1 «(* 2 3)»)"
  actions: left
  expected: "1"

- name: "left moves spatially backward"
  code: "(+ 1 (* 2 3)) «hello»"
  actions: [left, left, left, left, left, left, left, left]
  expected: "+"

- name: "right enters list from outside"
  code: "«(hello world)»"
  actions: right
  expected: "hello"

- name: "left exits list at first element"
  code: "(«hello» world)"
  actions: left
  expected: "(hello world)"

# ── §4. Vertical spatial navigation (up/down) ───────────────────────────────

- name: "down to next line"
  code: "«foo»\nbar"
  actions: down
  expected: "bar"

- name: "up to previous line"
  code: "foo\n«bar»"
  actions: up
  expected: "foo"

- name: "down maintains level - lists"
  code: "«(foo)»\n(bar)"
  actions: down
  expected: "(bar)"

- name: "down maintains level - symbols"
  code: "(«foo»)\n(bar)"
  actions: down
  expected: "bar"

- name: "up maintains level - lists"
  code: "(foo)\n«(bar)»"
  actions: up
  expected: "(foo)"

- name: "up maintains level - symbols"
  code: "(foo)\n(«bar»)"
  actions: up
  expected: "foo"

- name: "down at last line stays"
  code: "foo\n«bar»"
  actions: down
  expected: "bar"

- name: "up at first line stays"
  code: "«foo»\nbar"
  actions: up
  expected: "foo"

- name: "down between multi-line top-level forms"
  code: "«(foo)»\n\n(bar)\n\n(baz)"
  actions: [down, down]
  expected: "(baz)"

- name: "skip over comment with down"
  code: "«foo» ; comment\nbar"
  actions: down
  expected: "bar"

# ── §5. Nested list navigation — next vs right ──────────────────────────────

- name: "next within nested list - stops at boundary"
  code: "(«+» 1 (* 2 3))"
  actions: [next, next]
  expected: "(* 2 3)"

- name: "next does not enter nested list"
  code: "(+ 1 «(* 2 3)»)"
  actions: next
  expected: "(* 2 3)"

- name: "right spatially enters nested list"
  code: "(+ 1 «(* 2 3)»)"
  actions: right
  expected: "*"

- name: "right continues through nested list"
  code: "(+ 1 (* «*» 2 3))"
  actions: [right, right]
  expected: "3"

- name: "right exits nested list automatically"
  code: "(+ 1 (* 2 «3»))"
  actions: right
  expected: "(* 2 3)"

- name: "in explicitly enters nested list"
  code: "«(+ 1 (* 2 3))»"
  actions: in
  expected: "+"

- name: "out explicitly exits nested list"
  code: "(+ 1 («*» 2 3))"
  actions: out
  expected: "(* 2 3)"

- name: "out exits multiple levels explicitly"
  code: "(+ 1 («*» 2 3))"
  actions: [out, out]
  expected: "(+ 1 (* 2 3))"

- name: "previous stays at level, does not exit"
  code: "(+ 1 (* «*» 2 3))"
  actions: previous
  expected: "*"

# ── §6. Vector navigation ───────────────────────────────────────────────────

- name: "enter vector with in"
  code: "«[1 2 3]»"
  actions: in
  expected: "1"

- name: "enter vector with right"
  code: "«[1 2 3]»"
  actions: right
  expected: "1"

- name: "next within vector"
  code: "[«1» 2 3]"
  actions: [next, next]
  expected: "3"

- name: "next stops at end of vector"
  code: "[1 2 «3»]"
  actions: next
  expected: "3"

- name: "right exits vector at end"
  code: "[1 2 «3»]"
  actions: right
  expected: "[1 2 3]"

- name: "exit vector with out"
  code: "[1 «2» 3]"
  actions: out
  expected: "[1 2 3]"

- name: "left exits vector at start"
  code: "[«1» 2 3]"
  actions: left
  expected: "[1 2 3]"

- name: "previous stops at start of vector"
  code: "[«1» 2 3]"
  actions: previous
  expected: "1"

# ── §7. Nested vectors ──────────────────────────────────────────────────────

- name: "next within nested vectors stays at level"
  code: "[«1» [2 3] 4]"
  actions: [next, next]
  expected: "4"

- name: "next treats nested vector as unit"
  code: "[1 «[2 3]» 4]"
  actions: next
  expected: "4"

- name: "right enters nested vector"
  code: "[1 «[2 3]» 4]"
  actions: right
  expected: "2"

- name: "right exits nested vector and continues"
  code: "[1 [2 «3»] 4]"
  actions: right
  expected: "[2 3]"

- name: "right continues after nested vector exit"
  code: "[1 «[2 3]» 4]"
  actions: [right, right, right, right]
  expected: "4"

# ── §8. Map navigation ──────────────────────────────────────────────────────

- name: "enter map with in"
  code: "«{:a 1 :b 2}»"
  actions: in
  expected: ":a"

- name: "enter map with right"
  code: "«{:a 1 :b 2}»"
  actions: right
  expected: ":a"

- name: "next navigates map key to value"
  code: "{«:a» 1 :b 2}"
  actions: next
  expected: "1"

- name: "next navigates map value to next key"
  code: "{:a «1» :b 2}"
  actions: next
  expected: ":b"

- name: "next stops at last value"
  code: "{:a 1 :b «2»}"
  actions: next
  expected: "2"

- name: "right exits map at end"
  code: "{:a 1 :b «2»}"
  actions: right
  expected: "{:a 1 :b 2}"

- name: "previous navigates backward in map"
  code: "{:a 1 «:b» 2}"
  actions: previous
  expected: "1"

- name: "previous stops at first key"
  code: "{«:a» 1 :b 2}"
  actions: previous
  expected: ":a"

- name: "left exits map at start"
  code: "{«:a» 1 :b 2}"
  actions: left
  expected: "{:a 1 :b 2}"

# ── §9. Nested maps ─────────────────────────────────────────────────────────

- name: "next within nested map stays at level"
  code: "{«:a» {:b 1} :c 2}"
  actions: [next, next]
  expected: ":c"

- name: "next treats nested map as unit"
  code: "{:a «{:b 1}» :c 2}"
  actions: next
  expected: ":c"

- name: "right enters nested map"
  code: "{:a «{:b 1}» :c 2}"
  actions: right
  expected: ":b"

- name: "right exits nested map and continues"
  code: "{:a {:b «1»} :c 2}"
  actions: right
  expected: "{:b 1}"

- name: "right continues after nested map"
  code: "{:a «{:b 1}» :c 2}"
  actions: [right, right, right, right]
  expected: ":c"

# ── §10. Set navigation ─────────────────────────────────────────────────────

- name: "enter set"
  code: "«#{1 2 3}»"
  actions: in
  expected: "1"

- name: "navigate within set with next"
  code: "#{«1» 2 3}"
  actions: next
  expected: "2"

- name: "navigate within set with right"
  code: "#{«1» 2 3}"
  actions: right
  expected: "2"

- name: "right exits set at end"
  code: "#{1 2 «3»}"
  actions: right
  expected: "#{1 2 3}"

# ── §11. Complex nested structures ──────────────────────────────────────────

- name: "deeply nested - next stays at each level"
  code: "«(a (b (c d)))»"
  actions: [in, next]
  expected: "(b (c d))"

- name: "deeply nested - next stops at boundary"
  code: "(a «(b (c d))»)"
  actions: next
  expected: "(b (c d))"

- name: "deeply nested - right traverses full depth"
  code: "(«a» (b (c d)))"
  actions: [right, right, right, right, right, right, right, right]
  expected: "(a (b (c d)))"

- name: "deeply nested - in goes one level only"
  code: "(a «(b (c d))»)"
  actions: in
  expected: "b"

- name: "mixed structures - next respects boundaries"
  code: "(foo «[1 2]» {:a 3})"
  actions: next
  expected: "{:a 3}"

- name: "mixed structures - right enters all"
  code: "(foo «[1 2]» {:a 3})"
  actions: [right, right, right, right]
  expected: "{:a 3}"

- name: "mixed structures - right full traversal"
  code: "(«foo» [1 2] {:a 3})"
  actions: [right, right, right, right, right, right, right, right, right]
  expected: "(foo [1 2] {:a 3})"

# ── §12. Full spatial traversal ──────────────────────────────────────────────

- name: "right full spatial traversal from start"
  code: "«((a b) (c d))»"
  actions: [right, right, right, right, right, right, right, right, right]
  expected: "((a b) (c d))"

- name: "left full spatial traversal from end"
  code: "((a b) (c d)) «e»"
  actions: [left, left, left, left, left, left, left, left]
  expected: "a"

- name: "spatial traversal with multiple nesting"
  code: "(«+» (* 2 3) (- 5 1))"
  actions: [right, right, right, right, right, right, right, right, right, right, right]
  expected: "(+ (* 2 3) (- 5 1))"

- name: "complex mixed structure - right enters deeply"
  code: "(foo «[1 {:a 2}]» (bar baz))"
  actions: [right, right, right, right]
  expected: "2"

# ── §13. String literals ────────────────────────────────────────────────────

- name: "treat string as atomic with next - stops at boundary"
  code: '(println «"hello world"»)'
  actions: next
  expected: '"hello world"'

- name: "navigate to string with next"
  code: '(«println» "hello world")'
  actions: next
  expected: '"hello world"'

- name: "right from string exits to parent expression"
  code: '(println «"hello world"»)'
  actions: right
  expected: '(println "hello world")'

# ── §14. Keyword navigation ─────────────────────────────────────────────────

- name: "navigate keywords with next"
  code: "(«:name» :age :email)"
  actions: [next, next]
  expected: ":email"

- name: "navigate keywords with right"
  code: "(«:name» :age :email)"
  actions: [right, right]
  expected: ":email"

- name: "right exits at end of keywords"
  code: "(:name :age «:email»)"
  actions: right
  expected: "(:name :age :email)"

# ── §15. Function definitions ───────────────────────────────────────────────

- name: "navigate defn with next"
  code: "«(defn foo [x] (+ x 1))»"
  actions: [in, next, next, next]
  expected: "(+ x 1)"

- name: "navigate defn with right"
  code: "«(defn foo [x] (+ x 1))»"
  actions: [right, right, right, right]
  expected: "x"

- name: "next treats arg vector as unit"
  code: "(defn «foo» [x y] (+ x y))"
  actions: next
  expected: "[x y]"

- name: "right enters arg vector"
  code: "(defn foo «[x y]» (+ x y))"
  actions: right
  expected: "x"

- name: "navigate into function body with next"
  code: "(defn foo «[x]» (+ x (* 2 3)))"
  actions: next
  expected: "(+ x (* 2 3))"

- name: "navigate to nested expr in body - next stops"
  code: "(defn foo [x] «(+ x (* 2 3))»)"
  actions: [in, next, next]
  expected: "(* 2 3)"

- name: "navigate to nested expr in body - right continues"
  code: "(defn foo [x] «(+ x (* 2 3))»)"
  actions: [right, right, right]
  expected: "(* 2 3)"

# ── §16. Let bindings ───────────────────────────────────────────────────────

- name: "navigate to let binding vector with next"
  code: "«(let [x 1 y 2] (+ x y))»"
  actions: [in, next]
  expected: "[x 1 y 2]"

- name: "navigate to let binding vector with right"
  code: "«(let [x 1 y 2] (+ x y))»"
  actions: [right, right]
  expected: "[x 1 y 2]"

- name: "navigate within let bindings with next"
  code: "(let «[x 1 y 2]» (+ x y))"
  actions: [in, next, next, next]
  expected: "2"

- name: "next within bindings stops at end"
  code: "(let [x 1 y «2»] (+ x y))"
  actions: next
  expected: "2"

- name: "right exits bindings to body"
  code: "(let [x 1 y «2»] (+ x y))"
  actions: right
  expected: "[x 1 y 2]"

- name: "navigate to let body with next"
  code: "(let «[x 1 y 2]» (+ x y))"
  actions: next
  expected: "(+ x y)"

- name: "navigate to let body with right"
  code: "(let «[x 1 y 2]» (+ x y))"
  actions: [right, right, right, right, right, right]
  expected: "(+ x y)"

# ── §17. Function calls with multiple arguments ─────────────────────────────

- name: "navigate function with many args - next"
  code: "«(foo a b c d e)»"
  actions: [in, next, next, next]
  expected: "c"

- name: "navigate function with many args - right"
  code: "«(foo a b c d e)»"
  actions: [right, right, right, right]
  expected: "c"

- name: "right exits at end of args"
  code: "(foo a b c d «e»)"
  actions: right
  expected: "(foo a b c d e)"

# ── §18. Anonymous functions ────────────────────────────────────────────────

- name: "navigate to anonymous function with next"
  code: "«(map #(* % 2) [1 2 3])»"
  actions: [in, next]
  expected: "#(* % 2)"

- name: "navigate to anonymous function with right"
  code: "«(map #(* % 2) [1 2 3])»"
  actions: [right, right]
  expected: "#(* % 2)"

- name: "treat anonymous function as atomic with next"
  code: "(map «#(* % 2)» [1 2 3])"
  actions: next
  expected: "[1 2 3]"

- name: "right from anonymous function to vector"
  code: "(map «#(* % 2)» [1 2 3])"
  actions: right
  expected: "[1 2 3]"

# ── §19. Threading macros ───────────────────────────────────────────────────

- name: "navigate thread-first with next"
  code: "«(-> x (foo) (bar))»"
  actions: [in, next, next, next]
  expected: "(bar)"

- name: "navigate thread-first with right"
  code: "«(-> x (foo) (bar))»"
  actions: [right, right, right, right, right]
  expected: "(foo)"

- name: "next treats threaded forms as units"
  code: "(-> x «(foo 1)» (bar 2))"
  actions: next
  expected: "(bar 2)"

- name: "right enters threaded forms"
  code: "(-> x «(foo 1)» (bar 2))"
  actions: right
  expected: "foo"

- name: "navigate thread-last with next"
  code: "(->> «data» (map inc) (filter even?))"
  actions: [next, next]
  expected: "(filter even?)"

- name: "right spatial through thread-last"
  code: "(->> «data» (map inc) (filter even?))"
  actions: [right, right, right, right, right]
  expected: "(filter even?)"

# ── §20. Conditional forms ──────────────────────────────────────────────────

- name: "navigate if with next"
  code: "(if «test» then else)"
  actions: [next, next, next]
  expected: "else"

- name: "navigate if with right"
  code: "(if «test» then else)"
  actions: [right, right]
  expected: "else"

- name: "navigate cond with next"
  code: "(cond «(> x 0)» :pos (< x 0) :neg)"
  actions: [next, next, next]
  expected: ":neg"

- name: "navigate cond with right - enters first condition"
  code: "(cond «(> x 0)» :pos (< x 0) :neg)"
  actions: [right, right, right, right, right, right]
  expected: "(< x 0)"

# ── §21. Quoted forms ───────────────────────────────────────────────────────

- name: "treat quoted list as atomic with next"
  code: "(def x «'(a b c)»)"
  actions: next
  expected: "'(a b c)"

# Per structural-editing.md §6.3, '(a b c) is the list (a b c) carrying a
# quote Meta — a normal enterable compound, so Euler-tour right descends.
# (Pre-Meta-recognition semantics treated the quoted list as atomic.)
- name: "right from quoted list enters it"
  code: "(def x «'(a b c)»)"
  actions: right
  expected: "a"

# ── §22. Destructuring ──────────────────────────────────────────────────────

- name: "navigate destructuring in let"
  code: "(let [{:keys [a b]} «m»] (+ a b))"
  actions: previous
  expected: "{:keys [a b]}"

- name: "navigate into destructuring map"
  code: "(let [{:keys [a b]} m] (+ a b))"
  actions: [in, next, right, right]
  expected: ":keys"

- name: "navigate into destructuring vector"
  code: "(let [{:keys «[a b]»} m] (+ a b))"
  actions: right
  expected: "a"

# ── §23. Multi-arity functions ──────────────────────────────────────────────

- name: "navigate multi-arity function"
  code: "(defn «foo» ([x] x) ([x y] (+ x y)))"
  actions: [next, next, next]
  expected: "([x y] (+ x y))"

- name: "next treats arity clauses as units"
  code: "(defn foo «([x] x)» ([x y] (+ x y)))"
  actions: next
  expected: "([x y] (+ x y))"

- name: "right enters arity clause"
  code: "(defn foo «([x] x)» ([x y] (+ x y)))"
  actions: right
  expected: "[x]"

# ── §24. Edge cases and boundaries ──────────────────────────────────────────

- name: "next at end of list stays"
  code: "(a b «c»)"
  actions: next
  expected: "c"

- name: "previous at start of list stays"
  code: "(«a» b c)"
  actions: previous
  expected: "a"

- name: "right at end moves to parent"
  code: "(a b «c»)"
  actions: right
  expected: "(a b c)"

- name: "left at start moves to parent"
  code: "(«a» b c)"
  actions: left
  expected: "(a b c)"

- name: "right at top level with next expression"
  code: "«(a b)» (c d)"
  actions: [right, right, right, right]
  expected: "(c d)"

- name: "next at top level between expressions"
  code: "«(a b)» (c d)"
  actions: next
  expected: "(c d)"

- name: "right at outermost level enters"
  code: "«(foo)»"
  actions: right
  expected: "foo"

- name: "left at outermost level enters"
  # PENDING — spec-refinement question. nav.left is strict Euler-reverse and
  # no-ops at the outermost level (stays on "(foo)"), whereas the sibling
  # "right at outermost level enters" row passes because nav.right descends.
  # This asymmetry is unresolved in docs/specs/structural-editing.md §5.1.1;
  # the row encodes the desired symmetric "left enters" behaviour. Pending a
  # spec decision on outermost-left semantics.
  pending: true
  code: "«(foo)»"
  actions: left
  expected: "foo"

- name: "out at outermost level stays"
  code: "«(foo)»"
  actions: out
  expected: "(foo)"

- name: "skip whitespace with next"
  code: "(«a»    b)"
  actions: next
  expected: "b"

# ── §25. Top-level navigation ───────────────────────────────────────────────

- name: "navigate between top-level forms with next"
  code: "«(foo)» (bar) (baz)"
  actions: [next, next]
  expected: "(baz)"

- name: "navigate between top-level forms with right"
  code: "«(foo)» (bar) (baz)"
  actions: [right, right, right, right, right]
  expected: "(bar)"

# ── §26. Complex mixed structures ───────────────────────────────────────────

- name: "complex mixed structure - next stays level"
  code: "(foo «[1 {:a 2}]» (bar baz))"
  actions: next
  expected: "(bar baz)"

- name: "full spatial left-to-right traversal"
  code: "«((a) (b c) (d (e f)))»"
  actions: [right, right, right, right, right, right, right, right, right, right, right, right, right, right, right]
  expected: "((a) (b c) (d (e f)))"

# ── §27. first / last sibling ───────────────────────────────────────────────

- name: "first from middle sibling"
  code: "(a «b» c d)"
  actions: first
  expected: "a"

- name: "last from middle sibling"
  code: "(a «b» c d)"
  actions: last
  expected: "d"

- name: "first already at first"
  code: "(«a» b c)"
  actions: first
  expected: "a"

- name: "last already at last"
  code: "(a b «c»)"
  actions: last
  expected: "c"

- name: "first inside nested compound"
  code: "[x «y» z]"
  actions: first
  expected: "x"

- name: "last inside nested compound"
  code: "[x «y» z]"
  actions: last
  expected: "z"

- name: "first in map"
  code: "{«:b» 2 :a 1}"
  actions: first
  expected: ":b"

- name: "last in map"
  code: "{:a 1 «:b» 2}"
  actions: last
  expected: "2"

# ── §28. Range cursors: extendNext / extendPrev / shrink ────────────────────

- name: "extendNext creates range from node"
  code: "(«a» b c)"
  actions: extendNext
  expected: "a"  # range [a, b]; primary focus stays on anchor

- name: "extendPrev creates range from node"
  code: "(a «b» c)"
  actions: extendPrev
  expected: "b"  # range [a, b]; primary focus stays on anchor

- name: "extendNext twice extends range to three"
  code: "(«a» b c d)"
  actions: [extendNext, extendNext]
  expected: "a"  # range [a, b, c]

- name: "extendNext at last sibling is no-op"
  code: "(a b «c»)"
  actions: extendNext
  expected: "c"

- name: "extendPrev at first sibling is no-op"
  code: "(«a» b c)"
  actions: extendPrev
  expected: "a"

- name: "shrink reduces range by one"
  code: "(a «b» c)"
  actions: [extendNext, shrink]
  expected: "b"  # range collapsed back to single node

- name: "shrink on node cursor is no-op"
  code: "(«a» b c)"
  actions: shrink
  expected: "a"

- name: "extendNext then shrink round-trip"
  code: "(«a» b c)"
  actions: [extendNext, extendNext, shrink]
  expected: "a"  # range [a, b] after shrinking from [a, b, c]

- name: "extendPrev then shrink round-trip"
  code: "(a b «c»)"
  actions: [extendPrev, shrink]
  expected: "c"  # collapsed back to single node

# ── §29. Hole navigation basics ─────────────────────────────────────────────
#
# Holes are written as ($ name :type) in source.
# They are atomic leaves — next/prev treat them as single units.

- name: "navigate to hole with next"
  code: "(osc «freq» ($ amp :number))"
  actions: next
  expected: "($ amp :number)"

- name: "navigate from hole with next"
  code: "(osc freq «($ amp :number)»)"
  actions: next
  expected: "($ amp :number)"

- name: "navigate from hole with prev"
  code: "(osc freq «($ amp :number)»)"
  actions: previous
  expected: "freq"

- name: "right from hole exits to parent"
  code: "(osc «($ amp :number)»)"
  actions: right
  expected: "(osc ($ amp :number))"

- name: "left from hole goes to previous sibling"
  code: "(osc «($ freq :number)» amp)"
  actions: left
  expected: "osc"

- name: "hole is atomic - in is no-op"
  code: "(osc «($ freq :number)»)"
  actions: in
  expected: "($ freq :number)"

- name: "multiple holes - next steps between siblings"
  code: "(slow «($ rate :number)» ($ body :expr))"
  actions: next
  expected: "($ body :expr)"

# ── §30. nextHole / prevHole ────────────────────────────────────────────────

- name: "nextHole from before first hole"
  code: "(osc «freq» ($ amp :number))"
  actions: nextHole
  expected: "($ amp :number)"

- name: "nextHole from on a hole goes to next"
  code: "(osc ($ freq :number) «amp» ($ body :expr))"
  actions: nextHole
  expected: "($ body :expr)"

- name: "nextHole at last hole is no-op"
  code: "(osc ($ freq :number) «($ amp :number)»)"
  actions: nextHole
  expected: "($ amp :number)"

- name: "prevHole from after hole"
  code: "(osc ($ freq :number) «amp»)"
  actions: previousHole
  expected: "($ freq :number)"

- name: "prevHole from on a hole goes to previous"
  code: "(osc «($ amp :number)» ($ body :expr))"
  actions: previousHole
  expected: "($ amp :number)"

- name: "prevHole at first hole is no-op"
  code: "(osc «($ freq :number)» amp)"
  actions: previousHole
  expected: "($ freq :number)"

- name: "nextHole crosses top-level forms"
  code: "(osc «foo»)\n(synth ($ freq :number))"
  actions: nextHole
  expected: "($ freq :number)"

- name: "prevHole crosses top-level forms"
  code: "(osc ($ freq :number))\n(synth «bar»)"
  actions: previousHole
  expected: "($ freq :number)"

- name: "nextHole with no holes is no-op"
  code: "(osc «freq» amp)"
  actions: nextHole
  expected: "freq"

- name: "nextHole skips into nested structure"
  code: "(defn foo [x] (+ x «(* 2 ($ rate :number))»))"
  actions: nextHole
  expected: "($ rate :number)"

# ── §31. intoMeta navigation ────────────────────────────────────────────────
#
# Metas are attached to host nodes. intoMeta descends into the payload
# of the outermost Meta. Sigils (' ` ~ ~@ @) and #_ have no payload → no-op.
#
# PENDING — nav.intoMeta and Meta-payload-as-addressable-node are EXPLICITLY
# DEFERRED per docs/specs/structural-editing.md §5.1.9 & §6.7: "Meta payloads
# (Meta.payload) are currently opaque and not represented as addressable Nodes
# in the functional core, so there is nothing for a cursor to land on."
# Confirmed in core/nav.ts (the op is absent from `nav`, not a no-op stub) and
# core/types.ts (Meta.payload: unknown). The sigil "no-op" rows below also
# depend on this representation: with sigils lowered as Metas, `«foo»` would
# select just `foo` rather than the sigil-prefixed form ('foo, `foo, #_foo).
# These rows are preserved as future targets for when treeFromLezer lowers
# structured Meta payloads / sigils into id-bearing Nodes. Do not delete.

- name: "intoMeta on metadata prefix enters payload"
  pending: true  # §5.1.9/§6.7 deferred — Meta payloads not addressable
  code: "(^{:a 1} «foo» bar)"
  actions: intoMeta
  expected: "{:a 1}"

- name: "out from Meta payload returns to host"
  pending: true  # §5.1.9/§6.7 deferred — Meta payloads not addressable
  code: "(^«{:a 1}» foo bar)"
  actions: out
  expected: "foo"

- name: "intoMeta on quote is no-op - no payload"
  pending: true  # §6.7 deferred — sigil-as-Meta selection not lowered ('foo vs foo)
  code: "(def x '«foo»)"
  actions: intoMeta
  expected: "foo"

- name: "intoMeta on syntax-quote is no-op"
  pending: true  # §6.7 deferred — sigil-as-Meta selection not lowered (`foo vs foo)
  code: "(def x `«foo»)"
  actions: intoMeta
  expected: "foo"

- name: "intoMeta on ignore is no-op"
  pending: true  # §6.7 deferred — sigil-as-Meta selection not lowered (#_foo vs foo)
  code: "(def x #_«foo» bar)"
  actions: intoMeta
  expected: "foo"

- name: "intoMeta on node with no Metas is no-op"
  code: "(«foo» bar)"
  actions: intoMeta
  expected: "foo"

- name: "intoMeta enters outermost of stacked Metas"
  pending: true  # §5.1.9/§6.7 deferred — Meta payloads not addressable
  code: "(debug '^«foo»)"
  actions: intoMeta
  expected: "foo"

- name: "intoMeta round-trip through metadata"
  pending: true  # §5.1.9/§6.7 deferred — Meta payloads not addressable
  code: "(^{:a 1} «foo» bar)"
  actions: [intoMeta, out]
  expected: "foo"

# ── §32. Error-node degradation ─────────────────────────────────────────────
#
# Navigation onto or past error nodes is allowed. Mutations inside error
# regions are rejected (mutation tests cover this). Navigation should degrade
# gracefully — skip to the next stable parse boundary.

- name: "navigate to broken region with next"
  code: "(foo bar (baz"
  actions: [in, next, next]
  expected: "(baz"

- name: "navigate out of broken region with out"
  code: "(foo bar («baz»"
  actions: out
  expected: "(foo bar (baz"

- name: "right through broken region"
  code: "(«foo» bar (baz"
  actions: [right, right, right]
  expected: "(baz"

- name: "stable sibling unaffected by error"
  code: "(«foo» bar (baz"
  actions: next
  expected: "bar"

- name: "next skips past error to stable sibling"
  code: "(foo «bar» (baz"
  actions: next
  expected: "(baz"
