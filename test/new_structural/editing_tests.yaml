# Structural Editor Test Cases — Core Editing Operations
#
# Core structural ops that map to existing dispatcher actions: delete, slurp
# (list+vector), barf (list+vector), move next/prev, and edge cases. These are
# the fundamental tree-manipulation primitives.
#
# Test format:
# - name: descriptive test name
#   code: initial code state
#   selection: currently selected expression
#   actions: action or list of actions to perform
#   new_code: resulting code after actions
#   new_selection: selected expression after actions (if relevant)

# ============================================================================
# DELETE OPERATIONS
# ============================================================================

- name: "delete simple symbol"
  code: "(foo bar baz)"
  selection: "bar"
  actions: delete
  new_code: "(foo baz)"
  new_selection: "baz"

- name: "delete last symbol in list"
  code: "(foo bar baz)"
  selection: "baz"
  actions: delete
  new_code: "(foo bar)"
  new_selection: "bar"

- name: "delete first symbol in list"
  code: "(foo bar baz)"
  selection: "foo"
  actions: delete
  new_code: "(bar baz)"
  new_selection: "bar"

- name: "delete nested expression"
  code: "(+ 1 (* 2 3))"
  selection: "(* 2 3)"
  actions: delete
  new_code: "(+ 1)"
  new_selection: "1"

- name: "delete entire top-level expression"
  code: "(foo bar) (baz qux)"
  selection: "(foo bar)"
  actions: delete
  new_code: "(baz qux)"
  new_selection: "(baz qux)"

- name: "delete from vector"
  code: "[1 2 3]"
  selection: "2"
  actions: delete
  new_code: "[1 3]"
  new_selection: "3"

- name: "delete nested vector"
  code: "(foo [1 2 3] bar)"
  selection: "[1 2 3]"
  actions: delete
  new_code: "(foo bar)"
  new_selection: "bar"

# ============================================================================
# SLURP OPERATIONS (lists)
# ============================================================================

- name: "slurp right - list absorbs next element"
  code: "(a b) c"
  selection: "(a b)"
  actions: slurp_right
  new_code: "(a b c)"
  new_selection: "(a b c)"

- name: "slurp left - list absorbs previous element"
  code: "a (b c)"
  selection: "(b c)"
  actions: slurp_left
  new_code: "(a b c)"
  new_selection: "(a b c)"

- name: "slurp right nested"
  code: "(+ (* 2 3) 4)"
  selection: "(* 2 3)"
  actions: slurp_right
  new_code: "(+ (* 2 3 4))"
  new_selection: "(* 2 3 4)"

- name: "slurp left with multiple elements"
  code: "a b (c d)"
  selection: "(c d)"
  actions: slurp_left
  new_code: "a (b c d)"
  new_selection: "(b c d)"

- name: "slurp right at top level - nothing to slurp"
  code: "(a b c)"
  selection: "(a b c)"
  actions: slurp_right
  new_code: "(a b c)"
  new_selection: "(a b c)"

- name: "slurp right absorbs expression"
  code: "(foo) (bar baz)"
  selection: "(foo)"
  actions: slurp_right
  new_code: "(foo (bar baz))"
  new_selection: "(foo (bar baz))"

# ============================================================================
# SLURP OPERATIONS (vectors)
# ============================================================================

- name: "slurp right - vector absorbs next element"
  code: "[a b] c"
  selection: "[a b]"
  actions: slurp_right
  new_code: "[a b c]"
  new_selection: "[a b c]"

- name: "slurp left - vector absorbs previous element"
  code: "a [b c]"
  selection: "[b c]"
  actions: slurp_left
  new_code: "[a b c]"
  new_selection: "[a b c]"

- name: "slurp vector inside list"
  code: "(foo [1 2] 3)"
  selection: "[1 2]"
  actions: slurp_right
  new_code: "(foo [1 2 3])"
  new_selection: "[1 2 3]"

# ============================================================================
# BARF OPERATIONS (lists)
# ============================================================================

- name: "barf right - list expels last element"
  code: "(a b c)"
  selection: "(a b c)"
  actions: barf_right
  new_code: "(a b) c"
  new_selection: "(a b)"

- name: "barf left - list expels first element"
  code: "(a b c)"
  selection: "(a b c)"
  actions: barf_left
  new_code: "a (b c)"
  new_selection: "(b c)"

- name: "barf right nested"
  code: "(+ (* 2 3 4))"
  selection: "(* 2 3 4)"
  actions: barf_right
  new_code: "(+ (* 2 3) 4)"
  new_selection: "(* 2 3)"

- name: "barf left with nested expression"
  code: "((a b) c d)"
  selection: "((a b) c d)"
  actions: barf_left
  new_code: "(a b) (c d)"
  new_selection: "(c d)"

- name: "barf right single element - nothing to barf"
  code: "(a)"
  selection: "(a)"
  actions: barf_right
  new_code: "(a)"
  new_selection: "(a)"

# ============================================================================
# BARF OPERATIONS (vectors)
# ============================================================================

- name: "barf right - vector expels last element"
  code: "[a b c]"
  selection: "[a b c]"
  actions: barf_right
  new_code: "[a b] c"
  new_selection: "[a b]"

- name: "barf left - vector expels first element"
  code: "[a b c]"
  selection: "[a b c]"
  actions: barf_left
  new_code: "a [b c]"
  new_selection: "[b c]"

- name: "barf vector inside list"
  code: "(foo [1 2 3])"
  selection: "[1 2 3]"
  actions: barf_right
  new_code: "(foo [1 2] 3)"
  new_selection: "[1 2]"

# ============================================================================
# MOVE OPERATIONS (using previous/next)
# ============================================================================

- name: "move next - swap with next sibling"
  code: "(a b c)"
  selection: "a"
  actions: move_next
  new_code: "(b a c)"
  new_selection: "a"

- name: "move previous - swap with previous sibling"
  code: "(a b c)"
  selection: "c"
  actions: move_previous
  new_code: "(a c b)"
  new_selection: "c"

- name: "move next at end - no change"
  code: "(a b c)"
  selection: "c"
  actions: move_next
  new_code: "(a b c)"
  new_selection: "c"

- name: "move previous at start - no change"
  code: "(a b c)"
  selection: "a"
  actions: move_previous
  new_code: "(a b c)"
  new_selection: "a"

- name: "move next with nested expression"
  code: "(+ 1 (* 2 3))"
  selection: "1"
  actions: move_next
  new_code: "(+ (* 2 3) 1)"
  new_selection: "1"

- name: "move expression within vector"
  code: "[a b c]"
  selection: "b"
  actions: move_next
  new_code: "[a c b]"
  new_selection: "b"

# ============================================================================
# EDGE CASES AND ERROR CONDITIONS
# ============================================================================

- name: "slurp with nothing to absorb"
  code: "(a b c)"
  selection: "(a b c)"
  actions: slurp_right
  new_code: "(a b c)"
  new_selection: "(a b c)"

- name: "barf single element list"
  code: "(a)"
  selection: "(a)"
  actions: barf_right
  new_code: "(a)"
  new_selection: "(a)"

- name: "move at boundary does nothing"
  code: "(a b)"
  selection: "b"
  actions: move_next
  new_code: "(a b)"
  new_selection: "b"

- name: "delete and selection moves sensibly"
  code: "(only)"
  selection: "only"
  actions: delete
  new_code: "()"
  new_selection: "()"

- name: "paste without prior cut does nothing"
  code: "(a b)"
  selection: "a"
  actions: paste
  new_code: "(a b)"
  new_selection: "a"
