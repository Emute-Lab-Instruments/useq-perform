name: Runtime Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
      - feat/synth-engine
      - synth/**

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Mocha integration tests (structural + protocol)
        run: npm run test:mocha

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69

      - name: Typecheck
        run: npm run typecheck

      - name: Build app bundle
        run: npm run build

      - name: Runtime contract tests
        run: npm run test:contracts

      - name: Unit tests (jsdom browser environment)
        run: npm run test:unit

      - name: Grammar Lab concept artifact
        run: |
          npm run typecheck:grammar-lab
          npx eslint grammar-lab --no-warn-ignored
          npm run test:grammar-lab
          npm run build:grammar-lab

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Inspector runtime scenario validation (Chromium)
        run: npm run inspector:validate-runtime

      - name: Storybook browser smoke tests (Chromium)
        run: npx vitest run --project storybook

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install native test deps
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build

      # The pinned src-useq checkout exposes the wire protocol contract test
      # below, but
      # this repository has no runnable native DSP/synth suite or npm script.
      # Wiring those suites requires adding them to src-useq (or this repo),
      # which is outside this CI-only change; do not pretend the browser tests
      # cover the native DSP implementation.
      - name: Build src-useq wire protocol contract test
        working-directory: src-useq
        run: |
          meson setup build --buildtype=debug
          ninja -C build test/test_wire_protocol_contract

      - name: Run src-useq wire protocol contract test
        run: src-useq/build/test/test_wire_protocol_contract

      - name: Assert pinned src-useq status
        run: npm run src-useq:status

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Playwright e2e journeys (WASM worker runtime)
        run: npm run test:e2e
